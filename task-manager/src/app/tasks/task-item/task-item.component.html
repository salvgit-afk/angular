<li class="task-item" [ngClass]="{ 'completato': task.completato }">
  <label class="task-label">
    <input 
      type="checkbox" 
      [checked]="task.completato"
      (change)="onToggleChange($event)"
      class="task-checkbox"
    >
    <a [routerLink]="['/tasks', task.id]" class="task-text">
      {{ task.titolo | troncaTesto:25 }} — 
      <span class="task-date">{{ task.dataCreazione | date:'dd/MM/yyyy' | uppercase }}</span>
    </a>
  </label>

  <button class="delete-button" (click)="onDeleteClick()" aria-label="Elimina task">
    <svg xmlns="http://w3.org" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
      <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
    </svg>
  </button>
</li>
